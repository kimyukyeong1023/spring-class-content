<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <h2>데이터를 전송하는 방식</h2>
    <h3>전송할 때 사용하는 도구 2가지</h3>
    <p>서버에 요청을 보내고 응답받는 기능!</p>
    <ul>
      <li>fetch</li>
      <li>axios</li>
    </ul>
    <br />
    <hr />

    <h3>Axios 전송</h3>

    <script>
      //1. 서버전송
      axios
        .get("http://localhost:8080/hello")
        //2. 콘솔에 찍기
        .then((응답) => console.log(응답.data));
    </script>

    <hr />
    <br />
    <h3>fetch 전송</h3>
    <script>
      // 1. 서버로 통신해야된다! fetch(url) - get방식 전송
      // 스프링부트 서버한테 /hello 하면 "안녕하세요" 데이터를 응답
      // 받는다.
      // fetch("http://localhost:8080/hello")
      //   // 2.응답받기
      //   .then((응답) => 응답.text())
      //   .then((데이터) => console.log(데이터));
    </script>
  </body>
</html>
