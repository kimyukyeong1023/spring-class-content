<!-- main.html -->

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
 * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        background: linear-gradient(135deg, #ff6b8b, #ff8e53);
        color: #fff;
        font-weight: 500;
      }

      header div:first-child {
        font-weight: 700;
        font-size: 1.1rem;
      }
      ul {
        display: flex;
        list-style: none;
        gap: 1.2rem;
        align-items: center;
      }
      li {
        cursor: pointer;
      }
      li:last-child {
        background: rgba(255, 255, 255, 0.25);
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
      }
      a {
        color: #fff;
        text-decoration: none;
      }
      /*
      #post {
        width: 100%;
        height: 100vh; 뷰포트(화면) 높이만큼 최소한 채워라!
        background-color: lightblue;
      
      #product 
        width: 100%;
        height: 100vh;
        background-color: lightsalmon;
      */
       /* 섹션 공통 레이아웃 */
      section {
        min-height: 100vh;
        padding: 3rem 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      /* 게시판 카드 & 테이블 */
      .board-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }

      .board-table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        font-size: 0.95rem;
      }
      .board-table th {
        background: #fdf5f5;
        color: #666;
        padding: 0.9rem 0.5rem;
        border-bottom: 1px solid #eee;
        font-weight: 600;
      }
      .board-table td {
        padding: 0.9rem 0.5rem;
        border-bottom: 1px solid #f0f0f0;
      }
      .board-table tr:hover {
        background-color: #fff9f8;
      }
      .board-table .col-title {
        text-align: left;
        padding-left: 1.2rem;
      }
      .board-table .col-title a {
        color: #333;
      }
      .board-table .col-title a:hover {
        color: #ff6b8b;
      }
      /* Post 게시판 상단 & 검색 바 */
      .board-header {
        margin-bottom: 1.2rem;
      }
      .board-header h2 {
        font-size: 1.6rem;
        color: #222;
      }

      .board-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .search-form {
        display: flex;
        gap: 0.4rem;
      }
      .search-form select,
      .search-form input {
        padding: 0.45rem 0.7rem;
        font-size: 0.88rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        outline: none;
        background-color: #fff;
      }
      .search-form input:focus,
      .search-form select:focus {
        border-color: #ff6b8b;
      }
      .search-form button {
        background-color: #444;
        color: white;
        border: none;
        padding: 0.45rem 0.9rem;
        border-radius: 6px;
        font-size: 0.88rem;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .search-form button:hover {
        background-color: #222;
      }

      .btn-write {
        background: linear-gradient(135deg, #ff6b8b, #ff8e53);
        color: white;
        padding: 0.45rem 1rem;
        border-radius: 6px;
        font-size: 0.88rem;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      .btn-write:hover {
        opacity: 0.9;
      }

    </style>
  </head>
  <body>
    <header>
      <div>로고</div>

      <div>
        <ul>
          <li>Home</li>
          <li>
            <a href="#post">Post</a>
          </li>
          <li>
            <a href="#product">Product</a>
          </li>
          <li>Pay</li>
          <li th:if="${login}">
            <h3 th:text="${id} +'님 환영합니다!'"></h3>
          </li>

          <li th:unless="${login}">
            <a href="/index">Login</a>
          </li>
        </ul>
      </div>
    </header>

    <!-- main -->
    <main>
      <!--  a href ="#아이디" 현재 페이지안에서 움직이기!-->
      <section id="post">
        <div class="board-header">
          <h2>게시판</h2>
          <p style="color: #888; font-size: 0.85rem; margin-top: 4px">
            궁금한 점이나 일상을 자유롭게 공유해보세요.
          </p>
        </div>

        <!-- 검색 및 글쓰기 영역 -->
        <div class="board-controls">
          <form action="/post/search" method="get" class="search-form">
            <select name="type">
              <option value="title">제목</option>
              <option value="writer">작성자</option>
              <option value="content">내용</option>
            </select>
            <input type="text" name="keyword" placeholder="검색어를 입력하세요" />
            <button type="submit">검색</button>
          </form>
          <a href="/post/write" class="btn-write">+ 글쓰기</a>
        </div>


        <div class="board-card">
          <table class="board-table">
            <thead>
              <tr>
                <th style="width: 10%">번호</th>
                <th style="width: 50%">제목</th>
                <th style="width: 15%">작성자</th>
                <th style="width: 15%">작성일</th>
                <th style="width: 10%">조회</th>
              </tr>
            </thead>
            <tbody>
              <!-- 반복을 이용하여 태그출력 -->
              <tr th:each="board :${list}">
                <td th:text="${board.no}"></td>
                <td th:text="${board.title}"></td>
                <td th:text="${board.writer}"></td>
                <td th:text="${board.date}"></td>
                <td th:text="${board.readCount}"></td>

              </tr>
            </tbody>
          </table>


      </section>
      <section id="product"></section>
    </main>
  </body>
</html>
