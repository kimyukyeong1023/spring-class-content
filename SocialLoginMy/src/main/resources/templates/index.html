<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이버 로그인</title>
    <style>
      body {
        margin: 0;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .login-box {
        width: 360px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 40px 30px;
        text-align: center;
      }

      h2 {
        font-size: 28px;
        margin-bottom: 12px;
        color: #333;
      }

      p {
        margin: 0 0 28px;
        color: #666;
        font-size: 14px;
      }

      .naver-btn {
        display: block;
        width: 100%;
        border: none;
        border-radius: 12px;
        background: #03c75a;
        color: white;
        font-size: 16px;
        font-weight: 700;
        padding: 16px 0;
        cursor: pointer;
        text-decoration: none;
        box-sizing: border-box;
        transition: background 0.2s ease;
      }
      .naver-btn:hover {
        background: #02b351;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>소셜 로그인</h2>
      <p>다양한 소셜 계정으로 간편하게 로그인하세요.</p>

      <a
        class="naver-btn"
        href="https://nid.naver.com/oauth2.0/authorize?response_type=code&client_id=key&redirect_uri=http://localhost:8080/naver"
        style="margin-bottom: 16px"
      >
        네이버로그인
      </a>

      <a
        class="google-btn"
        href="https://accounts.google.com/o/oauth2/v2/auth?client_id=key&redirect_uri=http://localhost:8080/google&response_type=code&scope=email profile&access_type=offline"
        style="
          display: block;
          width: 100%;
          border: none;
          border-radius: 12px;
          background: #4285f4;
          color: white;
          font-size: 16px;
          font-weight: 700;
          padding: 16px 0;
          cursor: pointer;
          text-decoration: none;
          box-sizing: border-box;
          transition: background 0.2s ease;
          text-align: center;
        "
      >
        구글로그인
      </a>
    </div>
    <br />
    <h3 th:if="${code != null}" th:text="'code: ' + ${code}">code</h3>
    <h3 th:if="${googleCode != null}" th:text="'googleCode: ' + ${googleCode}">
      googleCode
    </h3>
  </body>
</html>
